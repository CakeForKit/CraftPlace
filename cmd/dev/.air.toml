[build]
cmd = "swag init -g ./cmd/dev/main.go --output ./docs && ./scripts/download-swagger-static.sh && go build -o ./tmp/main ./cmd/dev/main.go"
bin = "tmp/main"
include_ext = ["go", "yaml", "yml", "env", "tpl", "tmpl", "templ", "html", "css"]
exclude_dir = ["vendor", "tmp", "docs", "nginx"]
exclude_regex = [".*_templ.go"]
