[build]
cmd = "swag init -g ./cmd/mirror/main.go --output ./docs_mirror && go build -o tmp/main_${INSTANCE_ID} ./cmd/mirror/main.go"
bin = "tmp/main_${INSTANCE_ID}"
include_ext = ["go", "yaml", "yml", "env", "tpl", "tmpl", "templ", "html", "css"]
exclude_dir = ["vendor", "tmp", "docs", "docs_mirror", "nginx"]
exclude_regex = [".*_templ.go"]
