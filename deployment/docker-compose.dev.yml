services:
  app_craftplace:
    container_name: app_craftplace
    build:
      context: ../
      dockerfile: ./cmd/dev/Dockerfile 
    # ports:
    #   - "8080:8080"
    environment:
      - GIN_MODE=debug
      - AIR_WATCH=.
      - APP_PORT=8080
      - DB_READONLY=true
    depends_on:
      - postgres_craftplace
    volumes:
      - ../:/app          # Монтируем весь проект в контейнер
    command: air -c ./cmd/dev/.air.toml
    networks:
      - postgres-craftplace-net
  
  app_craftplace_replica1:
    container_name: app_craftplace_replica1
    build:
      context: ../
      dockerfile: ./cmd/replica/Dockerfile 
    environment:
      - GIN_MODE=debug
      - AIR_WATCH=.
      - APP_PORT=8081
      - DB_READONLY=true 
    depends_on:
      - postgres_craftplace
    # ports:
    #   - "8081:8081"
    networks:
      - postgres-craftplace-net
  
  app_craftplace_replica2:
    container_name: app_craftplace_replica2
    build:
      context: ../
      dockerfile: ./cmd/replica/Dockerfile 
    environment:
      - GIN_MODE=debug
      - AIR_WATCH=.
      - APP_PORT=8082
      - DB_READONLY=true 
    depends_on:
      - postgres_craftplace
    # ports:
    #   - "8082:8082"
    networks:
      - postgres-craftplace-net
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/conf.d:/etc/nginx/conf.d
      - ../nginx/static/:/usr/share/nginx/static/
      - ../Readme.md:/usr/share/nginx/Readme.md
      # - ../docs/:/usr/share/nginx/static/swagger/
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - app_craftplace
    networks:
      - postgres-craftplace-net

  postgres_craftplace:
    container_name: postgres_craftplace
    # hostname: postgres
    image: postgres:14.8-alpine3.18
    env_file:
      - ../configs/db_config.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-craftplace-vol:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - postgres-craftplace-net

  pg_migrator_craftplace:
    container_name: pg_migrator_craftplace
    depends_on:
      postgres_craftplace:
        condition: service_healthy  
    env_file:
      - ../configs/db_config.env
    environment:
      - POSTGRES_HOST=postgres_craftplace
    build:
      context: ../migrations
      dockerfile: Dockerfile
    networks:
      - postgres-craftplace-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    env_file: 
      - ../configs/db_config.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@craftplace.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-1234}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    depends_on:
      - postgres_craftplace 
    volumes:
      - ../configs/pgAdmin_config.json:/pgadmin4/servers.json
    networks:
      - postgres-craftplace-net

volumes:
  pg-craftplace-vol:
    driver: local

networks:
  postgres-craftplace-net:
    driver: bridge
    name: postgres-craftplace-net