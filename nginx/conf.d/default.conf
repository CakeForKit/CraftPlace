

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/static;
        index index.html; 
        try_files $uri $uri/ /index.html;
    }

    location /swagger/ {
        proxy_pass http://app_craftplace:8080/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://app_craftplace:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s; 
        proxy_read_timeout 30s;
    }
    
    # README.md
    location /documentation {
        alias /usr/share/nginx/static/Readme.html; 
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
    }

    location /img/ {
        # Путь к папке с картинками на сервере
        alias /usr/share/nginx/static/img/;
        
        # Включаем отдачу файлов
        autoindex off;
        
        # Кэширование статики
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Безопасность
        add_header X-Content-Type-Options nosniff;
        
        # Попытка отдать файл, если не найден - 404
        try_files $uri $uri/ =404;
    }

    location /reserved {
        return 301 /;
    }

    location /admin/ {
        proxy_pass http://pgadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /admin;
        
        # Важно для корректной работы pgAdmin
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types *;
        sub_filter 'href="/' 'href="/admin/';
        sub_filter 'src="/' 'src="/admin/';
        sub_filter 'action="/' 'action="/admin/';
    }
