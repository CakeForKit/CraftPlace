

server {
    listen 80;
    server_name localhost;
    proxy_pass_header Server;

    location / {
        root /usr/share/nginx/static;
        index index.html; 
        try_files $uri $uri/ /index.html;
        add_header Server "CraftPlace" always;
    }

    location /swagger/ {
        proxy_pass http://backend_primary/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxy_cache my_cache;
        # proxy_cache_key "$scheme$request_method$host$request_uri";
        # proxy_cache_valid 200 302 1h;
        
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Server "CraftPlace" always;
    }

    location /api/v1/ {
        if ($request_method = GET) {
            proxy_pass http://backend_cluster;
        }
        if ($request_method != GET) {
            proxy_pass http://backend_primary;
        }
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s; 
        proxy_read_timeout 30s;
        add_header Server "CraftPlace" always;
    }

    location /mirror/swagger/ {
        proxy_pass http://backend_mirror/mirror/swagger/;
        proxy_set_header X-Forwarded-Prefix /mirror;
        proxy_cache my_cache;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Server "CraftPlace" always;
    }

    location /mirror/api/v1/ {
        proxy_pass http://backend_mirror;
        # proxy_set_header X-Forwarded-Prefix /mirror;
        add_header Server "CraftPlace" always;
        add_header X-Application "Mirror-API" always;
    }
    
    # Статус сервера Nginx (сырые данные)
    location /nginx-status {
        stub_status on;
        access_log off;
        allow all;
        add_header Server "CraftPlace" always;
    }

    # Статус сервера Nginx (визуализация)
    location /status {
        alias /usr/share/nginx/static/status/;
        index status.html;
        try_files $uri $uri/ /status/status.html;
        add_header Server "CraftPlace" always;
    }

    # README.md
    location /documentation {
        alias /usr/share/nginx/static/Readme.html; 
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        add_header Server "CraftPlace" always;
    }

    location /img/ {
        alias /usr/share/nginx/static/img/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ =404;
        add_header Server "CraftPlace" always;
    }

    location /reserved {
        return 301 /;
    }

    location /admin/ {
        proxy_pass http://pgadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /admin;

        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types *;
        sub_filter 'href="/' 'href="/admin/';
        sub_filter 'src="/' 'src="/admin/';
        sub_filter 'action="/' 'action="/admin/';
        add_header Server "CraftPlace" always;
    }

    location /managment {
        alias /usr/share/nginx/static/managment/;
        index index.html;
        try_files $uri $uri/ /managment/index.html;
        add_header Server "CraftPlace" always;
    }
}
